version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-revora_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-revora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.instabox
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-revora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-revora_db}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      # Required secrets — loaded from .env (Docker Compose interpolates
      # ${VAR} from the project .env automatically).
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # API does not run the review worker when the dedicated worker service is up.
      - REVIEW_WORKER_ENABLED=false
      - DATABASE_POOL_SIZE=5
      - DATABASE_MAX_OVERFLOW=5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: bash -lc "alembic upgrade head && python -m app.queue.worker"
    volumes:
      - ./backend:/app
    env_file:
      - .env.instabox
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-revora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-revora_db}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - REVIEW_WORKER_ENABLED=true
      - REVIEW_WORKER_POLL_INTERVAL_SECONDS=2.0
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=5
      # Provider throttling: cap concurrent LLM calls per provider.
      - PROVIDER_CONCURRENCY_LIMIT=5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No ports are exposed for the worker. It shares the backend image and
    # depends on the DB; the API container runs with REVIEW_WORKER_ENABLED=false
    # so exactly one review worker is active.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
